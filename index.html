function loginContent(){return `<div class="login"><div class="loginhero"><div class="eyebrow">THE GAME STARTS HERE</div><h1>YOUR FRIENDS.<br>YOUR <span>GOAL.</span></h1><p>Your group. Your pitch. Every week.</p><div class="ball">⚽</div></div><div class="seg"><button class="${loginMode==='member'?'selected':''}" onclick="loginMode='member';render()">Player login</button><button class="${loginMode==='admin'?'selected':''}" onclick="loginMode='admin';render()">Admin login</button><button class="${loginMode==='create'?'selected':''}" onclick="loginMode='create';render()">Create group</button></div><form id="loginform" onsubmit="login(event)">${loginMode==='create'?'<label>Group name</label><input id="newgroup" required maxlength="60" placeholder="Friday Football Club">':''}<label>Group username</label><input id="username" required maxlength="50" autocomplete="username" placeholder="e.g. fridayfc"><label>${loginMode==='admin'?'Private admin password':'Shared group password'}</label><input id="password" type="password" required minlength="${loginMode==='admin'?12:10}" autocomplete="${loginMode==='create'?'new-password':'current-password'}">${loginMode==='create'?'<label>Private admin password</label><input id="adminpassword" type="password" required minlength="12" maxlength="200" autocomplete="new-password"><p class="subtle" style="margin-top:10px">Share the group password with players. Keep your admin password private.</p>':''}<div class="error" id="loginerror" role="alert"></div><button class="btn full">${loginMode==='create'?'Create my group →':loginMode==='admin'?'Open admin controls →':'Let’s play →'}</button></form><p style="text-align:center;color:var(--muted);font-size:11px;margin:17px 0">Each group has its own players and matches. Up to 30 players.</p><button class="btn secondary" style="width:100%" onclick="startDemo()">Explore the demo club</button><div style="text-align:center;margin-top:22px"><button class="mutedlink" onclick="installHelp()">Add to home screen</button></div></div>`}
function appContent(){return `${session.demo?'<div class="notice">INTERACTIVE DEMO · Changes stay on this device. <button onclick="setup()">Firebase connection →</button></div>':''}${page==='home'?home():page==='players'?players():page==='profile'?profile():admin()}`}
function home(){const m=match(),all=m?.entries||[],cap=format*2+4,confirmed=all.slice(0,cap);return `<div class="heading"><div><div class="eyebrow">${esc(data.group.name)}</div><h1 style="margin-top:7px">Match day.</h1><p>A little less planning. A lot more playing.</p></div><div class="seg"><button class="${format===5?'selected':''}" onclick="format=5;render()">5 × 5</button><button class="${format===7?'selected':''}" onclick="format=7;render()">7 × 7</button><button class="${format===8?'selected':''}" onclick="format=8;render()">8 × 8</button></div></div>${m?`<div class="hero"><div class="match-title-row"><h2>${esc(m.title)}</h2><span>${esc(new Date(m.date+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}))} · ${esc(m.time)}</span></div><div class="matchmeta"><span><small>LOCATION</small>⌖ ${esc(m.field)}</span></div><div class="herofoot"><div class="count">${confirmed.length}<span>/ ${cap} players · 4 substitutes</span></div><button class="btn ${me()&&all.includes(me().id)?'secondary':''}" onclick="joinMatch()">${me()&&all.includes(me().id)?'Leave match':all.length>=cap?'Join waiting list':'＋ I’m playing'}</button></div></div><div class="grid"><section><div class="sectionline"><h3>The lineup</h3><span class="subtle">${format} in each half + 4 substitutes</span></div><div class="pitch format-${format}"><div class="field"><div class="box topbox"></div><div class="box bottombox"></div></div><div class="formation">${pitchPlaces(m)}</div></div><div class="teamlabel" style="color:#7c8d72">BRING YOUR BOOTS. WE’LL BRING THE GAME.</div></section><aside><div class="card rosterCard"><div class="sectionline"><h3>On the team</h3><span class="subtle">${all.length}</span></div>${all.length?all.map((id,i)=>{const p=data.players.find(p=>p.id===id);return `<div class="roster">${avatar(p)}<span>${esc(p?.name||'Player')}<small>${entryLabel(m,id)}</small></span><span class="status">${normalizedSlots(m).indexOf(id)<0?'Wait':'✓'}</span></div>`}).join(''):'<p>Be the first to join this game.</p>'}</div></aside></div>`:`<div class="card blank"><h2>No ${format}-a-side game yet</h2><p>Your admin can schedule the next match.</p>${session.role==='admin'?'<button class="btn" onclick="matchForm()">Schedule a match</button>':''}</div>`}<div style="display:flex;justify-content:space-between;margin-top:24px"><button class="mutedlink" onclick="refresh()">↻ Refresh club</button><button class="mutedlink" onclick="installHelp()">Add to home screen</button></div>`}
function players(){const m=match();return `<div class="heading"><div><div class="eyebrow">${esc(data.group.name)}</div><h1 style="margin-top:10px">The squad.</h1></div><span class="pill">${data.players.length} / 30</span></div><div class="sectionline"><span class="subtle">Next match attendance</span><div class="seg"><button class="${format===5?'selected':''}" onclick="format=5;render()">5 × 5</button><button class="${format===7?'selected':''}" onclick="format=7;render()">7 × 7</button><button class="${format===8?'selected':''}" onclick="format=8;render()">8 × 8</button></div></div><p class="subtle" style="margin-bottom:14px">${m?esc(m.title)+' · '+esc(m.date)+' · '+esc(m.time):'No upcoming '+format+'-a-side match scheduled'}</p><div class="card">${data.players.map(p=>{const st=attendance(p,m);return `<div class="roster">${avatar(p)}<span class="roster-name">${esc(p.name)}<small>${p.device===device?'That’s you · ':''}${esc(st.label)}${session.role==='admin'&&p.claimCode?' · Player code: '+esc(p.claimCode):''}</small></span><span class="attendance" role="img" aria-label="${esc(st.label)}"><i class="attendance-dot ${st.joined?'green':'red'}"></i>${st.icon?`<b>${st.icon}</b>`:''}</span>${session.role==='admin'?`<button class="smallbtn" onclick="adminPlayerForm('${esc(p.id)}')">Edit</button><button class="smallbtn" onclick="adminAvailabilityForm('${esc(p.id)}')">Status</button><button class="smallbtn" onclick="deletePlayerForm('${esc(p.id)}')">Delete</button>`:''}</div>`}).join('')||'<p>No players yet.</p>'}</div><div class="attendance-legend"><span><i class="attendance-dot green"></i>Registered</span><span><i class="attendance-dot red"></i>Not registered</span></div>${session.role==='admin'?'<button class="btn" onclick="adminPlayerForm()">＋ Add player</button>':!me()?'<button class="btn" onclick="profileForm()">Create or link my profile</button>':''}${me()?'<button class="btn secondary" style="margin-top:12px" onclick="availabilityForm()">Update my availability</button>':''}<p class="subtle" style="margin-top:15px">✈️ Travel · 🤒 Sick · 🩹 Injured · 💼 At work</p><button class="mutedlink" style="margin-top:15px" onclick="refresh()">↻ Refresh squad</button><div class="footerword">GOOD COMPANY.<br>GREAT FOOTBALL.</div>`}
function profile(){const p=me();return `<div class="heading"><div><div class="eyebrow">YOUR PLACE IN ${esc(data.group.name)}</div><h1 style="margin-top:8px">My profile.</h1></div></div><div class="card" style="text-align:center;padding:32px"><div style="display:flex;justify-content:center;margin-bottom:15px">${avatar(p||{name:'You'})}</div><h2>${esc(p?.name||'Make it yours')}</h2><p>${p?'Your profile is ready. Join the next match from Match day.':'Create a new profile, or link the profile your admin already added.'}</p>${!p?'<button class="btn" onclick="profileForm()">Create or link profile</button>':session.role==='admin'?`<button class="btn" onclick="adminPlayerForm('${esc(p.id)}')">Edit my profile</button>`:'<p class="subtle">Ask your admin to change your name or photo.</p>'}</div>${p?`<div class="card"><h3>My availability</h3><p>${availabilityIcon(p.availability)} ${esc(p.availability||'Available')}</p><button class="btn" onclick="availabilityForm()">Update my availability</button><p>You can change your availability. Your admin manages names and photos.</p></div>`:''}<div class="card"><h3>Your player identity</h3><p>Use the same browser on your phone each week. If your admin added your profile, ask for its player code to link it to this phone.</p></div><button class="btn secondary" onclick="installHelp()">Add to home screen</button><button class="mutedlink" style="float:right;margin-top:15px" onclick="logout()">Log out</button>`}
function admin(){return `<div class="heading"><div><div class="eyebrow">YOU’RE THE ORGANISER</div><h1 style="margin-top:8px">Club admin.</h1><p>Set the game. Bring everyone together.</p></div></div><div class="stats"><div class="card"><div class="eyebrow">CLUB MEMBERS</div><div class="statnum">${data.players.length}</div></div><div class="card"><div class="eyebrow">SCHEDULED GAMES</div><div class="statnum">${data.matches.length}</div></div></div><div class="card"><div class="sectionline"><h3>Group access</h3><button class="smallbtn" onclick="groupForm()">Edit</button></div><p>${esc(data.group.name)}<br>Group username: <strong>${esc(data.group.username)}</strong><br>Share the group username and password with your friends. Keep your admin password private.</p></div><div class="card"><h3>Player management</h3><p>${data.players.length} of 30 player places used. Only you can edit or delete profiles.</p><button class="btn" onclick="go('players')">Manage players →</button></div><div class="sectionline"><h3>Match calendar</h3><button class="btn" onclick="matchForm()">＋ New match</button></div>${data.matches.map(m=>`<div class="card"><div class="sectionline"><h3>${esc(m.title)}</h3><span class="pill">${m.format} × ${m.format}</span></div><p>${esc(m.date)} · ${esc(m.time)}<br>${esc(m.field)} · ${esc(m.booking)}<br>${m.entries.length} signed up · ${esc(m.price)} AED / player</p><button class="smallbtn" onclick="matchForm('${esc(m.id)}')">Edit details</button> <button class="smallbtn" onclick="removeMatch('${esc(m.id)}')">Delete match</button></div>`).join('')}<div class="card"><h3>Field booking</h3><p>Book the field directly with its operator, then mark the match as “Booked” here. This app coordinates your friends; it does not reserve the field for you.</p></div>`}
function go(p){if(!session)return;page=p;render();$('.main').scrollTop=0;window.scrollTo(0,0)}
function startDemo(){session={role:'admin',demo:true};try{data=JSON.parse(localStorage.getItem('gg-demo'))||demoData()}catch{data=demoData()}page='home';render()}
function persist(){localStorage.setItem('gg-demo',JSON.stringify(data))}
async function rpc(action,payload={}){setLoading(true);try{return await rpcRequest(action,payload)}finally{setLoading(false)}}
async function rpcRequest(action,payload={}){if(session?.demo){if(action==='profile'){if(me())throw Error('Only the admin can update your profile.');if(data.players.length>=30)throw Error('Maximum 30 players.');data.players.push({id:crypto.randomUUID(),device,...payload})}if(action==='removeFromMatch'){if(session.role!=='admin')throw Error('Admin only.');const m=data.matches.find(m=>m.id===payload.id);m.entries=m.entries.filter(id=>id!==payload.playerId);m.slots=normalizedSlots(m)}if(action==='availability'){if(payload.playerId&&session.role!=='admin')throw Error('Admin only.');const p=payload.playerId?data.players.find(p=>p.id===payload.playerId):me();if(!p)throw Error('Create a profile first.');p.availability=payload.availability;if(payload.availability!=='Available')data.matches.forEach(m=>{m.entries=m.entries.filter(id=>id!==p.id);m.slots=normalizedSlots(m)})}if(action==='adminPlayer'){let p=data.players.find(p=>p.id===payload.id);if(!p){if(data.players.length>=30)throw Error('Maximum 30 players.');p={id:crypto.randomUUID(),device:'',claimCode:crypto.randomUUID().slice(0,12)};data.players.push(p)}Object.assign(p,{name:payload.name,photo:payload.photo})}if(action==='deletePlayer'){data.players=data.players.filter(p=>p.id!==payload.id);data.matches.forEach(m=>m.entries=m.entries.filter(id=>id!==payload.id))}if(action==='claim'){let p=data.players.find(p=>p.id===payload.id);if(!p||p.device||p.claimCode!==payload.code)throw Error('Incorrect player code.');p.device=device;p.claimCode=''}if(action==='join'){const m=data.matches.find(m=>m.id===payload.id),p=payload.playerId?data.players.find(p=>p.id===payload.playerId):me();if(payload.playerId&&session.role!=='admin')throw Error('Only the admin can add another player.');if(p?.availability&&p.availability!=='Available')throw Error('Set yourself Available before joining.');if(!p)throw Error('Create your player profile first.');m.slots=normalizedSlots(m);if(Number.isInteger(payload.slot)){if(m.slots[payload.slot]&&m.slots[payload.slot]!==p.id)throw Error('Position already taken.');if(!m.entries.includes(p.id))m.entries.push(p.id);m.slots=m.slots.map(id=>id===p.id?null:id);m.slots[payload.slot]=p.id}else{m.entries=m.entries.includes(p.id)?m.entries.filter(x=>x!==p.id):[...m.entries,p.id]}m.slots=normalizedSlots(m)}if(action==='group'){data.group.name=payload.name;data.group.username=payload.username}if(action==='match'){const old=data.matches.find(m=>m.id===payload.id);if(old)Object.assign(old,payload);else data.matches.push({...payload,id:crypto.randomUUID(),entries:[]})}if(action==='deleteMatch')data.matches=data.matches.filter(m=>m.id!==payload.id);persist();return data}
return await (await firebaseReady()).request(action,payload)}
async function login(e){e.preventDefault();const username=$('#username').value.trim(),password=$('#password').value;busy=true;setLoading(true,"Signing in…");$('#loginform button').disabled=true;try{const r=await rpc(loginMode==='create'?'register':'login',{username,password,role:loginMode,name:$('#newgroup')?.value.trim(),adminPassword:$('#adminpassword')?.value});session={token:r.token,role:r.role,groupId:r.groupId,backend:'firebase'};localStorage.setItem('gg-session',JSON.stringify({...session,endpoint}));data=r.data;page=loginMode==='create'?'admin':'home';render();(await firebaseReady()).watch();if(!me()&&session.role==='member')profileForm()}catch(err){if($('#loginerror'))$('#loginerror').textContent=err.message;else toast(err.message)}finally{setLoading(false);busy=false;if($('#loginform button'))$('#loginform button').disabled=false}}
async function logout(){if(session&&!session.demo){try{(await firebaseReady()).unwatch();await (await firebaseReady()).request('logout',{})}catch{}}localStorage.removeItem('gg-session');session=null;data=null;page='home';render()}
async function refresh(){try{data=await rpc('state');render();toast('Club updated')}catch(err){toast(err.message)}}
async function joinMatch(slot){if(!me()){pendingSlot=Number.isInteger(slot)?slot:null;profileForm();return}if(me().availability&&me().availability!=='Available'){availabilityForm();return}if(busy)return;busy=true;try{data=await rpc('join',{id:match().id,...(Number.isInteger(slot)?{slot}:{})});render();toast(match().entries.includes(me().id)?'You’re on the pitch!':'You’ve left the match')}catch(err){toast(err.message);if(!session.demo)await refresh()}finally{busy=false}}
function profileForm(){if(me()){toast('Your profile exists. Ask your admin to change it.');return}modal('Your player profile',`<p class="subtle" style="margin-top:12px">Already on the squad? Link your existing profile below instead of creating a duplicate.</p><form onsubmit="saveProfile(event)"><label>New player name</label><input id="playername" maxlength="35" required><label>Photo (optional)</label><input id="playerphoto" type="file" accept="image/*"><button class="btn full" ${data.players.length>=30?'disabled':''}>Create my profile →</button><div class="error" id="formerror"></div></form><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><button class="btn secondary" onclick="claimForm()">I’m already in the squad</button>`)}
async function photoData(file){if(!file)return me()?.photo||'';if(!file.type.startsWith('image/'))throw Error('Please choose an image.');return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const s=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.65))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('This photo format is not supported. Try JPG or PNG.'))};img.src=url})}
async function saveProfile(e){e.preventDefault();const slot=pendingSlot;pendingSlot=null;await submit(e,async()=>{const photo=await photoData($('#playerphoto').files[0]);data=await rpc('profile',{name:$('#playername').value.trim(),photo})},'Profile saved');if(me()&&slot!==null)await joinMatch(slot)}
async function submit(e,fn,message){const button=e.target.querySelector('button[type=submit],button.btn');button.disabled=true;try{await fn();closeModal();render();toast(message)}catch(err){$('#formerror').textContent=err.message;button.disabled=false}}
function groupForm(){modal('Group access',`<form onsubmit="saveGroup(event)"><label>Club name</label><input id="clubname" maxlength="60" value="${esc(data.group.name)}" required><label>Group username</label><input id="clubuser" readonly maxlength="60" value="${esc(data.group.username)}" required><label>New group password</label><input id="clubpass" type="password" minlength="10" required placeholder="At least 10 characters"><p class="subtle" style="margin-top:10px">The username stays the same. Changing the shared password requires members to sign in again.</p><button class="btn full">Save group access</button><div class="error" id="formerror"></div></form>`)}
async function saveGroup(e){e.preventDefault();await submit(e,async()=>{data=await rpc('group',{name:$('#clubname').value.trim(),username:$('#clubuser').value.trim(),password:$('#clubpass').value})},session.demo?'Demo access updated; no real credentials created':'Group access updated')}
function matchForm(id){const m=data.matches.find(m=>m.id===id)||{};modal(id?'Edit match':'Schedule a match',`<form onsubmit="saveMatch(event,'${esc(id||'')}')"><label>Match title</label><input id="mtitle" value="${esc(m.title||'Friday under the lights')}" maxlength="80" required><label>Format</label><select id="mformat"><option value="5" ${m.format===5?'selected':''}>5 vs 5 + 4 substitutes</option><option value="7" ${m.format===7?'selected':''}>7 vs 7 + 4 substitutes</option><option value="8" ${m.format===8?'selected':''}>8 vs 8 + 4 substitutes</option></select><div class="stats"><div><label>Date</label><input id="mdate" type="date" value="${esc(m.date||'')}" required></div><div><label>Kickoff</label><input id="mtime" type="time" value="${esc(m.time||'20:00')}" required></div></div><label>Field / location</label><input id="mfield" maxlength="100" value="${esc(m.field||'')}" required><label>Field booking</label><select id="mbooking"><option ${m.booking==='Pending'?'selected':''}>Pending</option><option ${m.booking==='Booked'?'selected':''}>Booked</option></select><label>Contribution per player (AED)</label><input id="mprice" type="number" min="0" max="10000" step="0.01" value="${esc(m.price??30)}" required><button class="btn full">Save match →</button><div class="error" id="formerror"></div></form>`)}
async function saveMatch(e,id){e.preventDefault();await submit(e,async()=>{data=await rpc('match',{id,title:$('#mtitle').value.trim(),format:Number($('#mformat').value),date:$('#mdate').value,time:$('#mtime').value,field:$('#mfield').value.trim(),booking:$('#mbooking').value,price:Number($('#mprice').value)})},'Match saved')}
function removeMatch(id){modal('Delete this match?',`<p style="margin:18px 0;line-height:1.6">The match and its sign-up list will be removed.</p><button class="btn danger" onclick="confirmDelete('${esc(id)}')">Delete match</button> <button class="btn secondary" onclick="closeModal()">Keep it</button>`)}
async function confirmDelete(id){try{data=await rpc('deleteMatch',{id});closeModal();render();toast('Match deleted')}catch(err){toast(err.message)}}
function setup(){modal('Firebase connected',`<p style="margin:18px 0;line-height:1.7">Group Goal uses Firebase for private group data and live match updates. Create a group or sign in with the credentials your admin gives you.</p><p class="subtle">Each group has up to 30 players. Keep the private admin password to yourself.</p>`)}
function installHelp(){modal('Keep it on your home screen',`<div class="install" style="margin-top:18px"><strong>iPhone</strong><p>Open your app link in Safari. Tap Share, then Add to Home Screen.</p><br><strong>Android</strong><p>Open your app link in Chrome. Open the ⋮ menu, then Add to Home screen.</p><br><p>For your friends, share this same app link. Keep the same browser so your player profile stays recognised.</p></div>`)}
function claimForm(){modal('Link existing profile',`<form onsubmit="claimProfile(event)"><label>Your name on the squad</label><select id="claimplayer">${data.players.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><label>Player code from your admin</label><input id="claimcode" required autocomplete="off"><p class="subtle" style="margin-top:12px">Your admin sees this code beside profiles they added. It prevents others from taking your place.</p><button class="btn full">Link my profile</button><div class="error" id="formerror"></div></form>`)}
async function claimProfile(e){e.preventDefault();const slot=pendingSlot;pendingSlot=null;await submit(e,async()=>{data=await rpc('claim',{id:$('#claimplayer').value,code:$('#claimcode').value.trim()})},'Profile linked to this phone');if(me()&&slot!==null)await joinMatch(slot)}
function adminPlayerForm(id){if(session.role!=='admin')return;const p=data.players.find(p=>p.id===id)||{};modal(id?'Edit player':'Add player',`<form onsubmit="saveAdminPlayer(event,'${esc(id||'')}')"><label>Player name</label><input id="apname" maxlength="35" value="${esc(p.name||'')}" required><label>Player photo</label><input id="apphoto" type="file" accept="image/*"><p class="subtle" style="margin-top:12px">For a new player, a private player code appears in the squad list after saving. Give it to that player to link their phone.</p><button class="btn full">Save player</button><div class="error" id="formerror"></div></form>`)}
async function saveAdminPlayer(e,id){e.preventDefault();await submit(e,async()=>{const p=data.players.find(p=>p.id===id);const f=$('#apphoto').files[0];const photo=f?await photoData(f):p?.photo||'';data=await rpc('adminPlayer',{id,name:$('#apname').value.trim(),photo})},'Player saved')}
function deletePlayerForm(id){if(session.role!=='admin')return;modal('Delete this player?',`<p style="margin:18px 0;line-height:1.6">Their profile and match sign-ups will be removed from this group.</p><button class="btn danger" onclick="confirmDeletePlayer('${esc(id)}')">Delete player</button> <button class="btn secondary" onclick="closeModal()">Keep player</button>`)}
async function confirmDeletePlayer(id){try{data=await rpc('deletePlayer',{id});closeModal();render();toast('Player deleted')}catch(err){toast(err.message)}}

function normalizedSlots(m){const cap=m.format*2+4,confirmed=m.entries.slice(0,cap),seen=[];const slots=Array.from({length:cap},(_,i)=>{const id=m.slots?.[i];if(id&&confirmed.includes(id)&&!seen.includes(id)){seen.push(id);return id}return null});confirmed.forEach(id=>{if(!seen.includes(id)){slots[slots.indexOf(null)]=id;seen.push(id)}});return slots}
function pitchCoordinates(f){const top=f===8?[[50,7],[20,24],[50,24],[80,24],[14,40],[38,40],[62,40],[86,40]]:f===7?[[50,7],[20,24],[50,24],[80,24],[20,40],[50,40],[80,40]]:[[50,7],[28,24],[72,24],[28,40],[72,40]];return [...top,...top.slice().reverse().map(([x,y])=>[x,100-y])]}

async function restoreLogin(){
 let saved;try{saved=JSON.parse(localStorage.getItem('gg-session')||'null')}catch{localStorage.removeItem('gg-session')}
 if(saved?.backend!=='firebase'||!saved.groupId||!['admin','member'].includes(saved.role)){render();return}
 session=saved;$('#app').innerHTML='<div class="app"><main class="main"><div class="blank">Opening your group…</div></main></div>';
 try{const fb=await firebaseReady();fb.activate(saved.role,saved.groupId);data=await rpc('state');page='home';render();fb.watch()}
 catch(err){session=null;data=null;if(/sign in again|permission|access was denied/i.test(err.message)){localStorage.removeItem('gg-session');render();toast('Please sign in again.')}else{$('#app').innerHTML='<div class="app"><main class="main"><div class="blank"><p>Could not connect. Your saved login is still available.</p><button class="btn" onclick="restoreLogin()">Try again</button><button class="btn secondary" onclick="logout()">Go to login</button></div></main></div>'}}
}
